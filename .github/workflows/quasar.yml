# AIFVS-ARTIFACT
# FILE: .github/workflows/quasar.yml

name: Quasar Public Search

on:
  workflow_dispatch:

jobs:
  quasar-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read search request
        run: cat search-request.yml || echo "No search-request.yml found"

      - name: Generate output
        run: |
          mkdir -p output
          echo "{ \"result\": \"Quasar ran successfully\" }" > output/datalake-output.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: datalake-output
          path: output/datalake-output.json
