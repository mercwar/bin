name: Avis Workflow

permissions:
  contents: write   # <-- grant push rights

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Data to write from trigger'
        required: true
        default: 'Default message'
      user:
        description: 'User name'
        required: false
        default: 'Anonymous'
      mode:
        description: 'Mode of execution'
        required: false
        default: 'test'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write trigger inputs to file
        run: |
          echo Payload: ${{ github.event.inputs.payload }} > avis.txt
          echo User: ${{ github.event.inputs.user }} >> avis.txt
          echo Mode: ${{ github.event.inputs.mode }} >> avis.txt

      - name: Verify file exists
        run: dir avis.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: avis-data
          path: avis.txt

      - name: Commit trigger data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add avis.txt
          git commit -m "Add trigger data from workflow dispatch"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
