name: Read Trigger File

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read avis.txt
        run: |
          echo "=== Contents of avis.txt ==="
          type avis.txt
          echo "=== End of file ==="

      - name: Upload avis.txt as artifact
        uses: actions/upload-artifact@v4
        with:
          name: avis-file
          path: avis.txt
