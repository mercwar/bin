name: Test Workflow

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Data to write from trigger'
        required: true
        default: 'Default message'
      user:
        description: 'User name'
        required: false
        default: 'Anonymous'
      mode:
        description: 'Mode of execution'
        required: false
        default: 'test'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write trigger inputs to file
        run: |
          echo Payload: ${{ github.event.inputs.payload }} > trigger_data.txt
          echo User: ${{ github.event.inputs.user }} >> trigger_data.txt
          echo Mode: ${{ github.event.inputs.mode }} >> trigger_data.txt

      - name: Verify file exists
        run: dir trigger_data.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trigger-data
          path: trigger_data.txt

